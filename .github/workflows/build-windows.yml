
name: Build Activity Tracker Windows EXE

"on":
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Configure node-gyp
        shell: pwsh
        run: |
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Windows application
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify scroll helper starts
        shell: pwsh
        run: |
          $exe = (Resolve-Path "python-dist/scroll_tracker.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP "scroll-helper.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "scroll-helper.stderr.log"
          $proc = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          taskkill /PID $proc.Id /T /F > $null 2>&1
          $logs = ""
          foreach ($file in @($stdout, $stderr)) {
            if (Test-Path $file) { $logs += (Get-Content $file -Raw) }
          }
          Write-Host $logs
          if ($logs -match "ModuleNotFoundError|ImportError|No module named") {
            throw "scroll_tracker.exe is missing a Python module. Check requirements.txt."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Activity-Tracker-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
